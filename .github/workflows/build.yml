name: Збірка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Збірка (непідписаний release APK)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Викласти APK у гілку apk-build
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/app-release-unsigned.apk
          echo "${GITHUB_SHA}" > out/commit.txt
          cd out
          git init -q
          git checkout -q -b apk-build
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-build

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: out/app-release-unsigned.apk
