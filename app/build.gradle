plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'ua.pp.supremegames.hmarochos'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.pp.supremegames.hmarochos'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Підпис тим самим ключем, що й перша версія APK — інакше оновлення не встановиться поверх.
    // Ключ і пароль беруться зі змінних середовища (на GitHub — із секретів репозиторію).
    // Без пароля (KS_PASS) збирається непідписаний APK — його підписують окремо тим самим ключем.
    def ksPass = System.getenv('KS_PASS')
    signingConfigs {
        release {
            if (ksPass) {
                storeFile file(System.getenv('KS_FILE') ?: '../signing/hmarochos-release.jks')
                storePassword ksPass
                keyAlias 'hmarochos'
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksPass) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.3.0')
    implementation 'com.google.firebase:firebase-messaging'
}
